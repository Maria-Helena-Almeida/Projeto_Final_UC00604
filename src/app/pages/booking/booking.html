<section class="booking-section">
  <h1>Marque o seu atendimento</h1>
  <form [formGroup]="bookingForm" (ngSubmit)="onSubmit()">
    <label>Nome completo</label>
    <input type="text" formControlName="name" />
    <div class="error" *ngIf="bookingForm.get('name')?.invalid && bookingForm.get('name')?.touched">
      Nome é obrigatório (mín. 3 caracteres)
    </div>

    <label>Email</label>
    <input type="email" formControlName="email" />
    <div class="error" *ngIf="bookingForm.get('email')?.invalid && bookingForm.get('email')?.touched">
      Email inválido
    </div>

    <label>Serviço</label>
    <select formControlName="service">
      <option value="">Selecione um serviço</option>
      <option *ngFor="let s of services" [value]="s">{{ s }}</option>
    </select>
    <div class="error" *ngIf="bookingForm.get('service')?.invalid && bookingForm.get('service')?.touched">
      Seleciona um serviço
    </div>

    <label>Data</label>
    <input type="date" formControlName="date" />
    <div class="error" *ngIf="bookingForm.get('date')?.invalid && bookingForm.get('date')?.touched">
      Data é obrigatória
    </div>

    <label>Hora</label>
    <input type="time" formControlName="time" />
    <div class="error" *ngIf="bookingForm.get('time')?.invalid && bookingForm.get('time')?.touched">
      Hora é obrigatória
    </div>

    <label>Observações (opcional)</label>
    <textarea formControlName="notes"></textarea>

    <button type="submit" [disabled]="bookingForm.invalid">Marcar Atendimento</button>
  </form>
</section>
